<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — EMBER</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">

<input type="checkbox" id="themeCheck" class="theme-check" />

<div class="auth-page-split">

  <div class="auth-image">
    <div class="auth-top-bar">
      <a href="home.html">EMBER</a>
    </div>
    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1200&q=85&auto=format&fit=crop" alt="Signature Burger" />
    <div class="auth-branding">
      <h1>EMBER</h1>
      <p>Eat. Fire. Repeat.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h2>Welcome Back</h2>
      <p class="auth-sub">Sign in to access your orders, Ember coins, and VIP deals.</p>

      <form id="loginForm" action="profile.html" method="get" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="your@email.com" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
        </div>

        <div class="auth-links mb-3">
          <label class="auth-checkbox-label">
            <input type="checkbox" checked style="accent-color: #D9662C;" />
            <span>Remember me</span>
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>

</div>


<script src="main.js"></script>
</body>
</html>
