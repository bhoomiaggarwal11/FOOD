<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logged Out — EMBER</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- THEME CHECKBOX (hidden) -->
<input type="checkbox" id="themeCheck" class="theme-check" />

<main class="auth-wrap">
  <div class="auth-card">
    <div class="logout-box">
      <div class="logout-icon-wrap">🔒</div>
      <h2>Logged Out Successfully</h2>
      <p>Thank you for dining with <strong>EMBER</strong>. Your session has been closed on this device.</p>

      <div class="logout-btn-group">
        <a href="login.html" class="btn btn-primary">Sign In Again</a>
        <a href="home.html" class="btn btn-ghost">Return to Home</a>
      </div>
    </div>

    <p class="auth-footer">
      Craving food? <a href="explore.html">Browse Menu</a>
    </p>
  </div>
</main>

</body>
</html>
