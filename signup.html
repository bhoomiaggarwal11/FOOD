<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — EMBER</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body class="auth-page">

<input type="checkbox" class="theme-check" />

<div class="auth-page-split">

  <div class="auth-image">
    <div class="auth-top-bar">
      <a href="home.html">EMBER</a>
    </div>
    <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=1200&q=85&auto=format&fit=crop" alt="Flame grilled food" />
    <div class="auth-branding">
      <h1>EMBER</h1>
      <p>Eat. Fire. Repeat.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h2>Create Account</h2>
      <p class="auth-sub">Join the Flame Club and get 50% OFF on your first order.</p>

      <form action="login.html" method="get">
        <div class="mb-3">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="Full Name" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Email" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="phone">Phone</label>
          <input type="tel" class="form-control" id="phone" placeholder="Phone" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Password" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirm">Confirm Password</label>
          <input type="password" class="form-control" id="confirm" placeholder="Confirm Password" required />
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

</div>

</body>
</html>
